<!DOCTYPE html>
<html>
    <head>

     <!-- Link to Bootstrap CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- Link to Bootstrap js -->
     <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
     <!-- Link to jQuery -->
     <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <!-- CSS Internal Styling -->
     <style>
        .container {
                color: rgb(114, 161, 138);
                font-family: Georgia, 'Times New Roman', Times, serif;
                text-align: center;
            }
        .p {
            color: rgb(255, 255, 255);
                font-family: Georgia, 'Times New Roman', Times, serif;
        }

        body {
            padding-bottom: 8vh; 
        }
     </style>

    <script> 
    $(function(){
      $("#footer").load("footer"); 
    });
    </script> 
    </head>

    <body>
         <!-- Title and Search Bar  -->
        <div class="container">
            <br>

        </div>
            <!-- Card(Background)  -->
            <div class="card card-body m-2 mb-3" style="min-width: 75vw; height: 100vw; background-color: #517D5A">
                <h3>   
                    <div class="card-title d-flex justify-content-center align-items-center">
                        <p class="card-text">
                            <div class="container">
                                <div class="row">
                                    <div id="familyDiv">  </div>    
                                </div>
                                <br>
                                <div class="row">
                                    <div id="speciesDiv">  </div>

                                </div>
                                <div class="row">
                                    <div id="varietyDiv">  </div>
                                </div>
                            </div>

                            <br>

                        </p>  
                    </div>
                </h3>
            </div>

            <div id="addFamilyPopup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #ccc; background: #fff; padding: 20px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2); z-index: 1000;">
                <form id="familyForm" action="/addfamily" method="post">
                    <strong>Family Name</strong>
                    <input type="text" name="family_add_name" id="family_add_name" required class="form-control" autofocus> <br>
                    <input type="submit" onclick="if (validateAddFamilyForm()) { this.disabled = true; this.form.submit(); } else { return false; }" value="Add Family">
                    <button type="button" onclick="togglePopup('addFamilyPopup')">Cancel</button>
                </form>
            </div>


        <div id="footer"> </div>



    <!-- Link to Mustache -->
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>


    <script> 

    'use strict';
    let isAdmin = false;  // Initialize isAdmin

    // Ensure the DOM is fully loaded before the script runs
    document.addEventListener('DOMContentLoaded', function() {
        setup();  // Call setup when the DOM is ready
        checkAdminStatus();  // Check if the user is an admin
    });

    function setup() {
        getFamilyResults();  // Fetch family results on setup
        
    }

    


    // Function to add admin-specific features
    function addAdminFeatures() {
        const familyDiv = document.getElementById('familyDiv');  // Assuming this element exists

        // Check if the "Add New Family" button already exists
        if (!document.getElementById('addFamilyButton')) {
            const addFamilyButton = document.createElement('button');
            addFamilyButton.textContent = 'Add New Family';
            addFamilyButton.id = 'addFamilyButton';
            addFamilyButton.classList.add('btn', 'btn-success', 'btn-lg', 'mt-3');
            addFamilyButton.onclick = () => togglePopup('addFamilyPopup');
            familyDiv.appendChild(addFamilyButton);
        }

        const editFamilyActions = document.createElement('div');
        editFamilyActions.classList.add('mt-3');
        editFamilyActions.id = 'editFamilyActions';
        familyDiv.appendChild(editFamilyActions);
        console.log(editFamilyActions);

        const speciesDiv = document.getElementById('speciesDiv');
        const editSpeciesActions = document.createElement('div');
        editSpeciesActions.classList.add('mt-3');
        editSpeciesActions.id = 'editSpeciesActions';
        speciesDiv.appendChild(editSpeciesActions);
    }


    let templateFamilyList = ` 
        <select class="form-select" id="templateFamilyList" aria-label="Default select Family">
            <option value="" selected>Select Family</option>
            {{#family}}
            <option value="{{family_id}}">{{family_name}}</option>
            {{/family}}
        </select>
    `;

    let templateSpeciesList = ` 
        <select class="form-select" id="templateSpeciesList" aria-label="Default select Family">
            <option value="" selected>Select Species</option>
            {{#species}}
            <option value="{{species_id}}">{{species_name}}</option>
            {{/species}}
        </select>
    `;

    let templateVarietyList = ` 
        <select class="form-select" id="templateVarietyList" aria-label="Default select Family">
            <option value="" selected>Select Variety</option>
            {{#variety}}
            <option value="{{variety_id}}">{{variety_name}}</option>
            {{/variety}}
        </select>
    `;


    function togglePopup(popupId) {
        const popupForm = document.getElementById(popupId);
        if (popupForm.style.display === 'none') {
            popupForm.style.display = 'block';
        } else {
            popupForm.style.display = 'none';
        }
    }

    let request = null;
    // Function to check if the user is an admin
    function checkAdminStatus() {
        let request = new XMLHttpRequest();
        request.onload = function() {
            if (this.status !== 200) {
                alert('Error: Failed to fetch admin status');
                return;
            }
            let response = JSON.parse(this.response);
            isAdmin = response === true;
            console.log(isAdmin ? 'User is an admin' : 'User is not an admin');
            if (isAdmin) {
                addAdminFeatures(); // Add admin-specific elements if the user is an admin
            }
        };
        request.onerror = function() {
            alert('Error: Failed to check admin status');
        };
        request.open('GET', '/isAdmin');
        request.send();
    }

    function getFamilyResults() {
        function makeCropList(family) {
            let map = {family: family};
            return Mustache.render(templateFamilyList, map);
        }

        function handleResponse() {
            if (this.status !== 200) {
                alert('Error: Failed to fetch data from server');
                return;
            }
            let response = JSON.parse(this.response);
            let divNode = document.getElementById('familyDiv');
            divNode.innerHTML = '';
            let buttonList = makeCropList(response);
            divNode.innerHTML = buttonList;
            checkAdminStatus();
        }

        function handleError() {
            alert('Error: Failed to fetch data from server');
        }

        let url = '/showFamily?family=';

        if (request !== null) {
            request.abort();
        }

        request = new XMLHttpRequest();
        request.onload = handleResponse;
        request.onerror = handleError;
        request.open('GET', url);
        request.send();
    }

    function getSpeciesResults(familyId) {
        function makeCropList(species) {
            let map = {species: species};
            return Mustache.render(templateSpeciesList, map);
        }

        function handleResponse() {
            if (this.status !== 200) {
                alert('Error: Failed to fetch data from server');
                return;
            }
            let response = JSON.parse(this.response);
            let divNode = document.getElementById('speciesDiv');
            divNode.innerHTML = '';
            let buttonList = makeCropList(response);
            divNode.innerHTML = buttonList;
            checkAdminStatus();

        }

        function handleError() {
            alert('Error: Failed to fetch data from server');
        }

        let encodedFamilyId = encodeURIComponent(familyId);
        let url = '/showSpecies?family=' + encodedFamilyId;

        if (request !== null) {
            request.abort();
        }

        request = new XMLHttpRequest();
        request.onload = handleResponse;
        request.onerror = handleError;
        request.open('GET', url);
        request.send();
    }

    function getVarietyResults(speciesId) {
        function makeCropList(variety) {
            let map = {variety: variety};
            return Mustache.render(templateVarietyList, map);
        }

        function handleResponse() {
            if (this.status !== 200) {
                alert('Error: Failed to fetch data from server');
                return;
            }
            let response = JSON.parse(this.response);
            let divNode = document.getElementById('varietyDiv');
            divNode.innerHTML = '';
            let buttonList = makeCropList(response);
            divNode.innerHTML = buttonList;
            checkAdminStatus();

        }

        function handleError() {
            alert('Error: Failed to fetch data from server');
        }

        let encodedSpeciesId = encodeURIComponent(speciesId);
        let url = '/showVariety?species=' + encodedSpeciesId;

        if (request !== null) {
            request.abort();
        }

        request = new XMLHttpRequest();
        request.onload = handleResponse;
        request.onerror = handleError;
        request.open('GET', url);
        request.send();
    }

    let timer = null;

    function debouncedGetResults() {
        clearTimeout(timer);
        timer = window.setTimeout(getFamilyResults, 500);
    }

    $(document).ready(function() {
        // Check if the user is an admin

        window.validateAddFamilyForm = function() { 
            const familyAddName = document.getElementById('family_add_name').value;
            // Validation checks
            if (!familyAddName) {
                alert("Family name cannot be empty.");
                return false;
            }
            if(familyAddName.length > 50) {
                alert("Please keep fields within a reasonable length");
                return false;
            }
            return true;
        };
        window.validateEditFamilyForm = function() { 
            const familyEditName = document.getElementById('family_edit_name').value;
            // Validation checks
            if (!familyEditName) {
                alert("Family name cannot be empty.");
                return false;
            }
            if(familyEditName.length > 50) {
                alert("Please keep fields within a reasonable length");
                return false;
            }
            return true;
        };
        $.ajax({
            url: '/isAdmin',
            method: 'GET',
            success: function(response) {
                if (response.isAdmin) {
                    isAdmin = true;
                    // Add admin-specific elements (like buttons) here
                    addAdminFeatures();  // Ensure admin features are added if the user is an admin
                } else {
                    isAdmin = false;
                }
            },
            error: function() {
                alert('Error: Unable to verify admin status.');
            }
        });


        $(document).on('change', '#templateFamilyList', function() {
            var selectedValue = $(this).val();
            var familyActionsContainer = document.getElementById('editFamilyActions');
            var speciesActionsContainer = document.getElementById('editSpeciesActions');
            var speciesDropDown = document.getElementById('templateSpeciesList');
            if(speciesDropDown)
                speciesDropDown.style.display = 'none';
            var varDropDown = document.getElementById('templateVarietyList');
            if(varDropDown)
                varDropDown.style.display = 'none';
            if(selectedValue == "") {
                familyActionsContainer.style.display = 'none';
                speciesActionsContainer.style.display = 'none';  
                return;
            }
            else {
                familyActionsContainer.style.display = 'block';
            }
            getSpeciesResults(selectedValue);
            

            window.validateAddSpeciesForm = function() { 
                const speciesAddName = document.getElementById('species_add_name').value;
                const latinNameAdd = document.getElementById('latin_name_add').value;

                // Validation checks
                if (!speciesAddName) {
                    alert("Species name cannot be empty.");
                    return false;
                }
                if (!latinNameAdd) {
                    alert("Latin name cannot be empty.");
                    return false;
                }
                if(latinNameAdd.length > 50 || speciesAddName.length > 50) {
                    alert("Please keep fields within a reasonable length");
                    return false;
                }
                return true;
            };
            window.validateEditSpeciesForm = function() { 
                const speciesEditName = document.getElementById('species_edit_name').value;
                const latinNameEdit = document.getElementById('latin_name_edit').value;

                // Validation checks
                if (!speciesEditName) {
                    alert("Species name cannot be empty.");
                    return false;
                }
                if (!latinNameEdit) {
                    alert("Latin name cannot be empty.");
                    return false;
                }
                if(latinNameEdit.length > 50 || speciesEditName.length > 50) {
                    alert("Please keep fields within a reasonable length");
                    return false;
                }
                return true;
            };


            // Dynamically update the family actions container
            familyActionsContainer.innerHTML = `
                <button type="button" onclick="togglePopup('editFamilyPopup${selectedValue}')" class="btn btn-success btn-sm">Edit</button>
                <form action="/deletefamily/${selectedValue}" method="post" class="d-inline">
                    <input type="submit" value="Delete" onclick="this.form.submit(); this.disabled=true;" class="btn btn-danger btn-sm">
                </form>
                <div id="editFamilyPopup${selectedValue}" class="popup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #ccc; background: #fff; padding: 20px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); z-index: 1000; border-radius: 8px;">
                    <form action="/editfamily/${selectedValue}" method="post">
                        <strong>Family Name</strong>
                        <input type="text" name="family_edit_name" class="form-control mb-2" required class="form-control" autofocus> <br>
                        <input type="submit" onclick="if (validateEditFamilyForm()) { this.disabled = true; this.form.submit(); } else {  return false; }" value="Edit Family">
                        <button type="button" onclick="togglePopup('editFamilyPopup${selectedValue}')" class="btn btn-secondary btn-sm">Cancel</button>
                    </form>
                </div>
                <button onclick="togglePopup('addSpeciesPopup')" class="btn btn-primary btn-sm">Add New Species</button>
                <div id="addSpeciesPopup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #ccc; background: #fff; padding: 20px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2); z-index: 1000; border-radius: 8px;">
                    <form action="/addspecies/${selectedValue}" onsubmit='return validateAddSpeciesForm()' method="post">
                        <strong>Species Name</strong>
                        <input type="text" name="species_add_name" class="form-control mb-2" id="species_add_name" required class="form-control" autofocus><br>
                        <strong>Latin Name</strong>
                        <input type="text" name="latin_name_add" class="form-control mb-2" id="latin_name_add" required class="form-control" autofocus><br>
                        <input type="submit" onclick="if (validateAddSpeciesForm()) { this.disabled = true; this.form.submit(); } else {  return false; }" value="Add Species">
                        <button type="button" onclick="togglePopup('addSpeciesPopup')" class="btn btn-secondary btn-sm">Cancel</button>
                    </form>
                </div>
            `;
        });



    });

    $(document).on('change', '#templateSpeciesList', function() {
    var selectedValue = $(this).val();
    var speciesActionsContainer = document.getElementById('editSpeciesActions');
    var varDropDown = document.getElementById('templateVarietyList');
    if(varDropDown)
        varDropDown.style.display = 'none';
    if(selectedValue == "") {
        speciesActionsContainer.style.display = 'none';
        return;
    }
    else {
        speciesActionsContainer.style.display = 'block';
    }

    getVarietyResults(selectedValue);
    

    window.validateAddVarietyForm = function() {
        // Helper function to validate integer values (non-negative and valid integer)
        function validInteger(intVal) {
            if (typeof intVal !== 'string' || intVal.length > 20) {
                return false;
            }

            // Remove leading and trailing spaces
            intVal = intVal.trim();

            // Check for number followed by character or exponential notation
            const regex = /^[0-9]+$/;

            // Check if the input matches the regex (only digits)
            if (!regex.test(intVal)) {
                return false;
            }


            const parsedValue = parseInt(intVal, 10); // Explicitly specify base 10 for parsing
            // Check if parsed value is a valid non-negative integer within the safe range
            return Number.isInteger(parsedValue) && parsedValue >= 0 && parsedValue <= Number.MAX_SAFE_INTEGER;
        }

        function isEmpty(val) {
            return val == "" || val == 'None';
        }

        function isValid(val) {
            return validInteger(val) || isEmpty(val);
        }

        // Get form field values
        const varietyName = document.querySelector('input[name="variety_name"]').value;
        const cropTypeName = document.querySelector('input[name="crop_type_name"]').value;
        const plantSpacingHarvest = document.querySelector('input[name="plant_spacing_harvest"]').value;
        const plantSpacingSeed = document.querySelector('input[name="plant_spacing_seed"]').value;
        const rowSpacingHarvest = document.querySelector('input[name="row_spacing_harvest"]').value;
        const rowSpacingSeed = document.querySelector('input[name="row_spacing_seed"]').value;
        const daysToMaturityHarvest = document.querySelector('input[name="days_to_maturity_harvest"]').value;
        const daysToMaturitySeed = document.querySelector('input[name="days_to_maturity_seed"]').value;
        const daysToTransplantation = document.querySelector('input[name="days_to_transplantation"]').value;
        const daysToDirectSow = document.querySelector('input[name="days_to_direct_sow"]').value;
        const daysToHarvest = document.querySelector('input[name="days_to_harvest"]').value;
        const daysToSeedHarvest = document.querySelector('input[name="days_to_seed_harvest"]').value;
        const frostSensitivityRating = document.querySelector('input[name="frost_sensitivity_rating"]').value;


        // Combined validation for integer fields using validInteger function in one if statement
        if (
            isEmpty(varietyName) || !isValid(plantSpacingHarvest) || !isValid(plantSpacingSeed) || !isValid(rowSpacingHarvest) || !isValid(rowSpacingSeed) ||
            !isValid(daysToMaturityHarvest) || !isValid(daysToMaturitySeed) || !isValid(daysToTransplantation) || !isValid(daysToDirectSow) ||
            !isValid(daysToHarvest) || !isValid(daysToSeedHarvest) || !validInteger(frostSensitivityRating)
        ) {
            alert("Please ensure all integer fields contain valid integers or are left blank, and no negative values are entered. Integers should be of a reasonable length");
            return false;
        }

        // If all checks pass, return true to allow form submission
        return true;
    }



        // Dynamically update the species actions container
        speciesActionsContainer.innerHTML = `
            <button type="button" onclick="togglePopup('editSpeciesPopup${selectedValue}')" class="btn btn-success btn-sm">Edit</button>
            <form action="/deletespecies/${selectedValue}" method="post" class="d-inline">
                <input type="submit" value="Delete" onclick="this.form.submit(); this.disabled=true;" class="btn btn-danger btn-sm">
            </form>
            <div id="editSpeciesPopup${selectedValue}" class="popup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #ccc; background: #fff; padding: 20px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); z-index: 1000; border-radius: 8px;">
                <form action="/editspecies/${selectedValue}" method="post">
                    <strong>Species Name</strong>
                    <input type="text" id="species_edit_name" name="species_edit_name" class="form-control mb-2" required class="form-control" autofocus> <br>
                    <strong>Latin Name</strong>
                    <input type="text" id="latin_name_edit" name="latin_name_edit" class="form-control mb-2" required class="form-control" autofocus> <br>
                    <input type="submit" onclick="if (validateEditSpeciesForm()) { this.disabled = true; this.form.submit(); } else { return false; }" value="Edit Species">
                    <button type="button" onclick="togglePopup('editSpeciesPopup${selectedValue}')" class="btn btn-secondary btn-sm">Cancel</button>
                </form>
            </div>
            
            <button type="button" onclick="togglePopup('addVarietyPopup')" class="btn btn-success btn-sm">Add Variety</button>
            <div id="addVarietyPopup" style="display: none; 
                position: fixed; 
                top: 50%; 
                left: 50%; 
                transform: translate(-50%, -50%); 
                border: 1px solid #ccc; 
                background: #fff; 
                padding: 20px; 
                box-shadow: 0px 4px 6px rgba(0,0,0,0.2); 
                z-index: 1000; 
                max-height: 80vh; /* Limit the height */
                overflow-y: auto; /* Make it scrollable */ 
                width: 90%; /* Adjust width for smaller screens */
                max-width: 600px; /* Prevent it from being too wide */">
                <form action="/addvariety/${selectedValue}" method="post">
                    <strong>Variety</strong>
                    <input type="text" name="variety_name" required class="form-control" autofocus> <br>
                    <strong>Crop Type</strong>
                    <input type="text" name="crop_type_name" autofocus> <br>
                    <strong>Seed Spacing for Harvesting Crops:</strong>
                    <input type="text" name="plant_spacing_harvest" value="0" autofocus> <br>
                    <strong>Seed Spacing for Harvesting Seeds:</strong>
                    <input type="text" name="plant_spacing_seed" value="0" autofocus> <br>
                    <strong>Row Spacing for Harvesting Crops:</strong>
                    <input type="text" name="row_spacing_harvest" value="0" autofocus> <br>
                    <strong>Row Spacing for Harvesting Seeds:</strong>
                    <input type="text" name="row_spacing_seed" value="0" autofocus> <br>
                    <strong>Days to Maturity for Harvesting Crops:</strong>
                    <input type="text" name="days_to_maturity_harvest" value="0" autofocus> <br>
                    <strong>Days to Maturity for Harvesting Seed:</strong>
                    <input type="text" name="days_to_maturity_seed" value="0" autofocus> <br>
                    <strong>Days to Transplantation:</strong>
                    <input type="text" name="days_to_transplantation" value="0" autofocus> <br>
                    <strong>Days to Direct Sow:</strong>
                    <input type="text" name="days_to_direct_sow" value="0" autofocus> <br>
                    <strong>Days for Harvesting Crops:</strong>
                    <input type="text" name="days_to_harvest" value="0" autofocus> <br>
                    <strong>Days for Harvesting Seeds:</strong>
                    <input type="text" name="days_to_seed_harvest" value="0" autofocus> <br>
                    <strong>Frost Sensitivity Rating:</strong>
                    <input type="text" name="frost_sensitivity_rating" value="0" autofocus> <br>
                    <input type="submit" onclick="if (validateAddVarietyForm()) { this.disabled = true; this.form.submit(); } else { return false; }" value="Add Variety">
                    <button type="button" onclick="togglePopup('addVarietyPopup')">Cancel</button>
                </form>
            </div>
        `;
    });


    $(document).on('change', '#templateVarietyList', function() {
        var selectedValue = $(this).val();
        window.location = '/showcrop/' + selectedValue
    });



    </script>

    </body>
</html>
