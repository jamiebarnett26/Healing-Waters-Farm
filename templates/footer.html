<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        /* Footer Styling */
        .footer {
            background-color: #e7fff5; /* Updated background color */
            height: clamp(50px, 21vw, 150px);  
            display: inline-block;
            justify-content: space-around; 
            align-items: center; /* Vertically center the buttons */
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            padding: 0 10px;
            vertical-align: top;
        }

        .footer .btn {
            width: 100%;
            margin: 2px 0;  /* Reduced margin */
            font-size: clamp(10px, 3.9vw, 30px);  /* Smaller font size for buttons */
            padding: 5px 0;  /* Reduced padding inside buttons */
        }

        /* Responsive design for mobile */
        @media (max-width: 576px) {
            .footer .col {
                flex: 0 0 50%;   /* Two columns for medium screens */
                max-width: 50%;
            }
        }

        @media (max-width: 375px) {
            .footer .col {
                flex: 0 0 100%;  /* Stack buttons in one column on very small screens */
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    
    <footer class="footer">
        <div class="container text-center px-2" style = "vertical-align: top;">
            <div class="row py-1" style = "vertical-align: top;">

                {% if admin %}
                    <div class="col-3 px-1">
                        <div class="btn btn-dark">
                            My Crops
                        </div>
                    </div>
                    <div class="col-3 px-1">
                        <div class="btn btn-dark">
                            Home
                        </div>
                    </div>
                    <div class="col-3 px-1">
                        <div class="btn btn-dark">
                            Community
                        </div>
                    </div>
                        <div class="col-3 px-1">
                            <div class="btn btn-dark">
                                Profiles
                            </div>
                        </div>

                {% else %}
                    <div class="col-4">
                        <div class="btn btn-dark">
                            My Crops
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="btn btn-dark">
                            Home
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="btn btn-dark">
                            Community
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </footer>

    <!-- jQuery functions - button links -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // redirects "My Crops" button to showusercrops page
            $('.btn-dark:contains("My Crops")').on('click', function() {
                window.location.href = '/showusercrops';
            });
            $('.btn-dark:contains("Profiles")').on('click', function() {
                window.location.href = '/profile_list';
            });
            $('.btn-dark:contains("Home")').on('click', function() {
                window.location.href = '/homepage';
            });
            $('.btn-dark:contains("Community")').on('click', function() {
                window.location.href = '/community';
            });
        });
    </script>

</body>
</html>
