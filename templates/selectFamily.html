<!DOCTYPE html>
<html>
    <body>
        {% include 'cropselection_header.html' %}
        <br>
        <strong>Select Family</strong>
        <br>
        <form action="/selectFamily" method="get">

        {% endfor %}
        {% include 'footer.html' %}
    </body>
</html>
