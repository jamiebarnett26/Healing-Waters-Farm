<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <div id="calendar-container">
        <div id="months-row"></div>
    </div>
    <footer class="footer">
        {% include 'footer.html' %}
    </footer>
    

    <style>
        #months-row {
            /* Flex display allows it to be arranged horizontally */
            display: flex;
        }

        .month-container {
            display: flex;
            /* Lets content run top to bottom -> places months above days */
            flex-direction: column;
            align-items: center;
        }

        .month-label {
            font-size: 5vh;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px; /* Space between month label and dates */
        }

        .days-row {
            display: flex;
        }

        .day {
            /* Relative position means it is relative to window, absolute position means it is relative to parent element */
            position: relative;
            font-size: 2vh;
            align-items: center;
            justify-content: center;
            padding: 1vh;
            width: 2vh;
            height: 2vh;
            font-family: 'Courier New', Courier, monospace;
        }

        .vertical-line {
            /* Absolute position so it is centered relative to days */
            position: absolute;
            top: 100%;
            width: 2px;
            height: 500vh;
            background-color: black;
            left: 50%;
        }

        .event {
            background-color: rgb(132, 208, 141);
            height:10vh;
            font-size: 3vh;
            left:100%;
            position: absolute; 
            /* Puts event above day */
            z-index: 1; 
        }

        .footer {
            display:flex;
            font-size:7vw;
            background-color: #52c35f;
            color: white;
            text-align: center;
            justify-content: center;
            align-items:center;
            line-height: 60px; /* Center text vertically */
            position: fixed; /* Fix the footer to the bottom of the viewport */
            left: 0;
            bottom: 0;
            height:25vh;
            width: 100%; /* Full width of the viewport */
        }
    </style>

    <script>
        let currDate = new Date(); 
        /* Sample events */
        const events = [
            { name: "Event 1", startDate: new Date("2024-11-05"), endDate: new Date("2024-11-18") },
            { name: "Event 1", startDate: new Date("2024-11-14"), endDate: new Date("2024-11-18") },
            { name: "Event 1", startDate: new Date("2024-11-05"), endDate: new Date("2024-11-18") }
        ];

        function loadDates() {
            const monthsRow = document.getElementById("months-row");
            let currentMonth = currDate.getMonth();

            // Container for the current month and its dates
            let monthContainer = createMonthContainer(currDate);

            let eventNum = 0;
            // Loads 101 dates -> might need to be reworked to be more flexible
            for (let i = -1; i < 100; i++) {
                
                /* Creates date relative to startdate */
                const date = new Date(currDate);
                date.setDate(currDate.getDate() + i);


                // Check if month changes and create a new month container
                if (date.getMonth() !== currentMonth) {
                    monthsRow.appendChild(monthContainer); 

                    // Reset for the new month
                    currentMonth = date.getMonth();
                    monthContainer = createMonthContainer(date); 
                }

                // Create day div
                const dayDiv = document.createElement("div");
                dayDiv.className = "day";
                dayDiv.textContent = date.getDate();

                // Create and add vertical line
                const lineDiv = document.createElement("div");
                lineDiv.className = "vertical-line";
                if(isSameDate(date, currDate)) {
                    lineDiv.style.backgroundColor="red";
                }
                dayDiv.appendChild(lineDiv);
                
                

                // Append day to current month's days row
                monthContainer.querySelector(".days-row").appendChild(dayDiv);
 
                // Print all events
                events.forEach(event => {
                    const eventStartDate = event.startDate;
                    const eventEndDate = event.endDate;
                    if (isSameDate(eventStartDate, date)) {
                        eventNum++;
                        loadEvent(dayDiv, event, eventNum); // Call loadEvent for the event
                    }
                    if (isSameDate(eventEndDate, date)) {
                        eventNum--;
                    }
                });
                
            }

            // Append the last month container
            monthsRow.appendChild(monthContainer);
            
        }

        // For checking two dates are the same -> == doesn't work
        function isSameDate(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                date1.getMonth() === date2.getMonth() &&
                date1.getDate() === date2.getDate();
    }
        

        // Prints events on screen 
        function loadEvent(dayDiv, event, eventNum) {
            const eventStartDate = new Date(event.startDate);
            const eventEndDate = new Date(event.endDate);

            const startDayOffset = Math.floor((eventStartDate - currDate) / (1000 * 60 * 60 * 24));
            const endDayOffset = Math.floor((eventEndDate - currDate) / (1000 * 60 * 60 * 24));

            const eventDiv = document.createElement("div");
            eventDiv.className = "event";
            eventDiv.textContent = event.name;

            const numberOfDays = endDayOffset - startDayOffset + 1; // Include the last day
            const dayWidth = 4; // Ensure this matches your actual day width in vh

            eventDiv.style.width = `${numberOfDays * dayWidth}vh`;
            eventDiv.style.top = `${((eventNum-1) * 10) + 4}vh`;
           

            dayDiv.appendChild(eventDiv);
        }


        // Create a container for a given month
        function createMonthContainer(date) {
            const monthContainer = document.createElement("div");
            monthContainer.className = "month-container";

            const monthLabel = document.createElement("div");
            monthLabel.className = "month-label";
            monthLabel.textContent = date.toLocaleString('default', { month: 'long', year: 'numeric' });
            monthContainer.appendChild(monthLabel);

            const daysRow = document.createElement("div");
            daysRow.className = "days-row";
            monthContainer.appendChild(daysRow);

            return monthContainer;
        }
        
        document.addEventListener("DOMContentLoaded", loadDates);
        

    </script>
    
</body>



</html>
