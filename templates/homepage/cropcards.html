<!DOCTYPE html>

<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Our CSS -->
    <link rel = "stylesheet" href = "../../static/css/styles.css">
    <!-- CSS for checkbox element -->
    <link rel = "stylesheet" href = "../../static/css/checkbox.css">

    <!-- Link to Bootstrap js -->
    <script src= 
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Link to jQuery -->
    <script src=
        "https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js">
    </script>

    <!-- Page specific CSS -->
    <style>
        /* Element for last card to add crop */
        .add_crop_card {
                aspect-ratio: 1;
                width: 50vw;
                height: 50vw;
                border-radius: 25%;
                display: flex;
                align-items: center;
                justify-content: center;
            } 
    </style>
</head>

<html>
    <body>
    <div class="d-flex flex-row flex-nowrap overflow-scroll px-2 pe-5">
        {% for crop_info, todos, variety_id in crops_with_todos %}
            <div class="card card-body m-2 mb-3" style="min-width: 75vw; min-height: 300px; background-color: #517D5A">
                <h3> 
                    <div class="card-title d-flex justify-content-center align-items-center">
                        <button class = "btn btn-dark" type = "button" id = "card-button-{{ variety_id }}"> 
                            <em style = "font-size: 6.5vw"> 
                                {{ crop_info['variety_name'] }}
                            </em>
                        </button>
                        <!-- info icon -->
                        <img id="infoButton-{{crop_info['variety_name']}}" src = "./static/img/info.png" alt="info logo" style="width:8vw;height:8vw;" >
                    </div>
                </h3>
                {% set outer_loop = loop %}

                {% for todo in todos %}
                    <!-- For some very strange reason, the checkboxes won't work unless I explicitly call the loop.index before the template. I think it is a jinja issue but this seems to be the only answer without rewriting everything without nested loops -->
                    <span style="display: none;">{{ loop.index }}</span>
                    {% include 'homepage/checkbox.html' %}
                    <hr>
                {% endfor %}
                <button id="edit-button" onclick="showEditForm()">Edit Task</button>
                <div id="edit-form" style="display: none;">
                    <h3>Select a task to edit</h3>
                    <label for="taskDropdown"></label>
                    <select id="taskDropdown">
                        <option value="indoor_seed_starting_date">Start indoor seeding</option>
                        <option value="transplanting_date">Transplant plants outdoors</option>
                        <option value="direct_sow_date">Direct sowing</option>
                        <option value="harvest_date">Prepare for harvest</option>
                    </select>
                    <label for="taskDateInput">New Date:</label>
                    <input type="date" id="taskDateInput">
                    <button id="save-edit-button">Save</button>
                    <button id="cancel-edit-button">Cancel</button>
                </div>   
                <button id="add-button" onclick="showAddForm()">Add Task</button>
                             
            </div>
        {% endfor %}
        
        <!-- Last Card - for adding crop -->
        <div class="card card-body text-white m-2 mb-3 d-flex align-items-center" style="min-width: 75vw; min-height: 300px; background-color: #517D5A;">
            <h1 class = "mb-4" style = "font-size: 10vw; text-align: center;"> <b>Add New Crop</b></h1>
            <div class="add_crop_card text-white flex-column bg-dark" id= "end_add_crop">
                <img src="../static/img/plus.svg" class = "mb-2" style = "height: 30vw;">
            </div>
        </div>
    </div>


     <!-- modal popup -->
    <div class="modal" tabindex="-1" id="infoModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title"> Crop Information </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              

            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

    <script>
        // Show the edit form when the "Edit Task" button is clicked
        $(document).ready(function () {
            $('#edit-button').on('click', function () {
                $('#edit-form').show();
            });

            $('#cancel-edit-button').on('click', function () {
                $('#edit-form').hide();
            });


            $('#save-edit-button').on('click', function () {
                let selectedTask = $('#taskDropdown').val(); 
                let newDate = $('#taskDateInput').val(); 

                if (!selectedTask || !newDate) {
                    alert("Please select a task and a date!");
                    return;
                }

                // Send the data to the backend via AJAX
                $.ajax({
                    url: '/edit_task', 
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        date_field: selectedTask, 
                        new_date: newDate 
                    }),
                    success: function (response) {
                        if (response.success) {
                            location.reload();
                        } else {
                            alert("Failed to update task: " + response.message);
                        }
                    },
                    error: function (xhr, status, error) {
                        alert("An error occurred while updating the task: " + error);
                    }
                });
            });
        });


        // For buttons with crop names
        $(document).ready(function() {
            $('[id^=card-button]').on('click', function() {
                var varietyId = $(this).attr('id').split('card-button-')[1];

                window.location.href = '/showcrop/' + varietyId;
            });
        });

        
        $(document).ready(function() {
            // When infoButton clicked -> show modal
            $('[id^=infoButton]').on('click', function() {
                var familyClicked = $(this).attr('id').split('infoButton-')[1];
                console.log(familyClicked);

                $("#infoModal").modal('show');

            });

        //     // When modal show -> get family info
        //     $('#infoModal').on('show.bs.modal', function(event) {
        //         // 1) get button title
        //         var title = $(event.realtedTarget).data('title');
        //         $this.find('.modal-title').html(title);

        //         var familyId = $(this).attr("id").split("_")[1];

        //         // 2) send AJAX Request
        //         let encodedFamily = encodeURIComponent(familyId);
        //         let url = '/selectSpecies?familyid=' +  encodedFamily;
        //         let request = new XMLHttpRequest();
        //         request.onload = handleResponse;
        //         request.onerror = handleError;
        //         request.open('GET', url);
        //         request.send();   

        //     });
        });

        // For last button to add crop
        $(document).ready(function() {
            $('#end_add_crop').on('click', function() {
                window.location.href = '/selectFamily';
            });
        });
    </script>

    <script src = "../../static/js/script.js"></script>
    </body>
</html>
