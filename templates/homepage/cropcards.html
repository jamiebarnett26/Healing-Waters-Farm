<!DOCTYPE html>

<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src= 
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <link rel = "stylesheet" href = "../../static/checkbox.css">

</head>

<script>
    function toggleDone(checkbox, taskId) {
        const taskText = document.getElementById('task-' + taskId);
        taskText.classList.toggle('done', checkbox.checked);
    }
</script>

<html>
    <body>
    <div class="d-flex flex-row flex-nowrap overflow-scroll">
        {% for crop_info, todos in crops_with_todos %}
            <div class="card card-body m-2 me-1" style="min-width: 75vw; min-height: 300px; background-color: #309F5E">
                <h3> 
                    <a href = "/testpage" class = "text-white"> 
                        <em style = "font-size: 6.5vw"> {{ crop_info['variety_name'] }} </em>
                    </a>
                </h3>
                {% set outer_loop = loop %}

                {% for todo in todos %}
                <!-- Taken from the checkbox.css source -->
                <div class="checkbox-wrapper-61">
                    <input type="checkbox" class="check" id="check-{{ loop.index }}-{{ outer_loop.index }}" />
                        <label for="check-{{ loop.index }}-{{ outer_loop.index }}" class="label">
                            <svg width="45" height="45" viewBox="0 0 95 95">
                                <rect x="30" y="20" width="50" height="50" stroke="black" fill="none" />
                                <g transform="translate(0,-952.36222)">
                                    <path d="m 56,963 c -102,122 6,9 7,9 17,-5 -66,69 -38,52 122,-77 -7,14 18,4 29,-11 45,-43 23,-4 " stroke="black" stroke-width="3" fill="none" class="path1" />
                                </g>
                            </svg> 
                            <!-- End of content taken from checkbox.css source -->
                            <div class = "checkbox-text text-white">
                                <h5> {{ todo.task }} </h4>
                                <h6 style = "opacity: 70%;"> {{ todo.date }} </h6>
                            </div>
                        </label>
                </div>
                <hr>
            {% endfor %}
            </div>
        {% endfor %}
    </div>

    <script src = "../../static/script.js"></script>
    </body>
</html>
