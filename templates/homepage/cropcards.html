<head>

    <link rel = "stylesheet" href = "../../static/css/checkbox.css">
    <!-- Link to Bootstrap js -->
    <script src=  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src= "https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"> </script>


    <!-- Page specific CSS -->
    <style>
        /* Element for last card to add crop */
        .add_crop_card {
                aspect-ratio: 1;
                width: 50vw;
                height: 50vw;
                border-radius: 25%;
                display: flex;
                align-items: center;
                justify-content: center;
            } 
    </style>
</head>

<html>
    <body>
    <div class="d-flex flex-row flex-nowrap overflow-scroll px-2 pe-5">

        <div id="cropcards"> </div>

        <!-- Last Card - for adding crop -->
        <div class="card card-body text-white m-2 mb-3 d-flex align-items-center" style="min-width: 75vw; min-height: 300px; background-color: #517D5A;">
            <h1 class = "mb-4" style = "font-size: 10vw; text-align: center;"> <b>Add New Crop</b></h1>
            <div class="add_crop_card text-white flex-column bg-dark" id= "end_add_crop">
                <img src="../static/img/plus.svg" class = "mb-2" style = "height: 30vw;">
            </div>
        </div>
    </div>



     <!-- modal popup -->
     <div class="modal" tabindex="-1" id="infoModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title"> Crop Information </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">

            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>


    <!-- Link to Mustache -->
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>

    <script>

    'use strict';

    let templateCropCard = ` 
    {{#crops}}
    <div class="card card-body m-2 mb-3" style="min-width: 75vw; min-height: 300px; background-color: #517D5A">
        <h3> 
            <div class="card-title d-flex justify-content-center align-items-center">
                <button class="btn btn-dark" type="button" id="card-button-{{variety_id}}"> 
                    <em style="font-size: 6.5vw"> 
                        {{crop_info.variety_name}} <!-- Access crop_info properties like this -->
                    </em>
                </button>
                
                <!-- info icon -->

                <img id="infoButton-{{crop_info.variety_name}}" src="./static/img/info.png" alt="info logo" style="width:8vw;height:8vw;" >
  
                
                <!-- Delete button -->
                <button class="btn btn-danger" onclick="deleteCrop({{todos[0].user_crop_id}})">Delete Crop</button>
            </div>
        </h3>

        <!-- Render Todo List for each crop -->
        <!-- Loop over todos (tasks) for this crop -->
        <div class="todos">
            {{#todos}} <!-- This is a list of tasks -->
            <div class="todo">
                <input type="checkbox" {{#completed}}checked{{/completed}} disabled /> <!-- If the task is completed, mark the checkbox -->
                <span>{{task}}</span> <!-- Display the task name -->
            </div>
            {{/todos}}
        </div>
    </div>
    {{/crops}}
`;


    

    // Function to fetch and render crop cards
    let request = null;
    function getCropCards() {

        function makeCropCard(crops_with_todos) {
            // Transform the data structure to match the template format
            let crops = crops_with_todos.map(item => {
                return {
                    crop_info: item[0],  // crop_info is the first element of each tuple
                    todos: item[1],      // todos is the second element of each tuple
                    variety_id: item[2]  // variety_id is the third element of each tuple
                };
            });
            let map = { crops: crops };                         // Prepare the data for the Mustache template
            let html = Mustache.render(templateCropCard, map);  // Render the HTML using Mustache
            return html;
        }
        
        function handleResponse() {
            console.log("HANDLERESPONSE");
            if(this.status !== 200) {
            alert('Error: Failed to fetch data from server');
            return;
            }
            let response = JSON.parse(this.response);

            // response.forEach(function(item) {
            // var cropInfo = item[0];   // The crop information
            // var tasks = item[1];      // The list of tasks
            // var varietyId = item[2];  // The variety ID

            console.log(response);
            // You can now update the UI with this information
            //});

            let divNode = document.getElementById('cropcards');
            divNode.innerHTML = '';
            let cropCards = makeCropCard(response);
            divNode.innerHTML = cropCards;
     }

        function handleError(request) {
            alert('Error: Failed to fetch data from server');
        }

        // Start of function
        let url = '/getCropCardInfo';
        if (request !== null) {
            console.log("ABOORT");
            request.abort();
        }
        request = new XMLHttpRequest();
        request.onload = handleResponse;
        request.onerror = handleError;
        request.open('GET', url);
        request.send();
    }

    
    function setup() {
        console.log("SETUP");
        // Click on crop names
        $('[id^=card-button]').on('click', function() {
            var varietyId = $(this).attr('id').split('card-button-')[1];
            window.location.href = '/showcrop/' + varietyId;
        });
        // Click on add crop
        $('#end_add_crop').on('click', function() {
            window.location.href = '/selectFamily';
         });
         // Click info button
         $('[id^=infoButton]').on('click', function() {
            var familyClicked = $(this).attr('id').split('infoButton-')[1];
            console.log(familyClicked);

            $("#infoModal").modal('show');

        });

        getCropCards();
    }


    if (document.readyState !== 'loading') {
        setup();
    } else {
        document.addEventListener('DOMContentLoaded', function () {
            console.log('document was not ready, place code here');
            setup();
        });
    }

    


       

    
    </script>

    </body>
</html>
