<!-- LOGIN PAGE -->

<!DOCTYPE html>

<html>

    <head> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Link to Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

         <!-- CSS Internal Styling -->
        <style>
            body {
                margin: 0;
                padding: 0;
                width: 100%; /* full window width */
                text-align: center;
            }
        
            button {
                color: tomato
            }

            img {
                width: 100%;
                height: 50%;  
            }

            h4 {
                color: rgb(114, 161, 138);
                font-family: Georgia, 'Times New Roman', Times, serif;
            }

            h3 {
                color: rgb(114, 161, 138);
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 20px;
            }

            .container_input {
                display: grid;
                justify-items: start;
                color: rgb(114, 161, 138);
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 100%;
            }

        
        </style>

    </head>

    <!-- HTML Code -->
    <body>

        <div>
            <div class="container">
                <div class="logo">
                    <img src="./static/img/logoTemp.png" alt="Farm Logo">
                </div>
            </div>
        </div>
        
         <!-- Text -->
        <h4> <strong> Healing Waters </strong> </h4>
        <br>
        <br>
        <h3> Login </h3>

        <br>
  
      
        <div class="container">

            <div class="row">
                <div class="col-4">
                    <label for="inputEmail" class="col">Email</label>
                </div>
                <div class="col-6">
                    <input type="email" class="form-control" id="inputEmail">
                </div>
            </div>

            <div class="row">
                <div class="col-4">
                    <label for="inputPassword" class="col-4">Password</label>
                </div>
                <div class="col-6">
                    <input type="password" class="form-control" id="inputPassword">
                </div>
            </div>
        </div>

        <br>
        <br>

        <button type="button" class="btn btn-primary" >Login</button>
       
           
        <!-- Link to Bootstrap JS -->
        <script src=  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    </body>



</html>
