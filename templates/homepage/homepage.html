<!DOCTYPE html>

<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Our CSS -->
    <link rel = "stylesheet" href = "../../static/css/styles.css">

    <!-- Link to Bootstrap js -->
    <script src= 
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Link to jQuery -->
    <script src=
        "https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js">
    </script>

    <!-- Page Specific CSS -->
    <style>
        /* This gets rid of the scrollbar effect */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>

</head>

<html>
<body style = "font-family: NotoSans;">
    <div class = "container-fluid">
        {% include 'homepage/boxes_w_info.html' %}
    </div>
    <div class="container-fluid bg-success-subtle rounded-top-5 p-0" style = "background-color: rgb(105, 138, 119);">

        <!-- This button takes you to old homepage -->
            <div class = "col mx-auto text-center p-3">
                <button class = "btn btn-dark w-100" type = "button" id = "test_button"> Logout </button>
            </div>
        <!----------------- ^Testing^ ----------------->

        <div class="container-fluid p-0">
            <h1 style = "font-size: 10vw;">
                <a href = "/testpage" class = "text-dark px-2"> <b> Crop Tasks: </b> </a>
            </h1>
            {% include 'homepage/cropcards.html' %}
        </div>
    </div>

    <footer class="footer fixed-bottom" style = "background-color: white; border-top: 2px solid black;">
        <div class="container text-center">
            <div class="row">
                <div class="col">
                    <div class="btn btn-dark">
                        My Crops
                    </div>
                </div>
                <div class="col">
                    <div class="btn btn-dark">
                        Account
                    </div>
                </div>
                <div class="col">
                    <div class="btn btn-dark">
                        Community
                    </div>
                </div>
                {% if admin %}
                    <div class="col">
                        <div class="btn btn-dark">
                            Profiles
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </footer>

<!-- jQuery functions - button links -->
    <script>
        $(document).ready(function() {
            $('#test_button').on('click', function() {
                window.location.href = '/logout';
            });

            // redirects "My Crops" button to showusercrops page
            $('.btn-dark:contains("My Crops")').on('click', function() {
                window.location.href = '/showusercrops';
            });
            $('.btn-dark:contains("Profiles")').on('click', function() {
                window.location.href = '/profile_list';
            });
        });
    </script>
</body>
</html>
