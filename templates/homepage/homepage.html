<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Our CSS 
    <link rel = "stylesheet" href = "../../static/css/styles.css">-->

    <!-- Link to Bootstrap js -->
    <script src= 
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <meta name="theme-color" content="#fff"/>

    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <link rel="manifest" href="/manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/serviceWorker.js')
                .then(function(registration) {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch(function(error) {   
                    console.log('Service Worker registration failed:', error);
                });
            });
        }

        // Function to check offline status
        function isOffline() {
            return !navigator.onLine;  // Return true if offline
        }

        // Function to toggle online/offline content
        function toggleOfflineElements() {
            const onlineElements = document.querySelectorAll('.online-only'); // These elements will only be shown when online
            const offlineElements = document.querySelectorAll('.offline-only');
            if (isOffline()) {
                onlineElements.forEach(el => el.style.display = 'none');
                offlineElements.forEach(el => el.style.display = 'block');
                loadCropsFromLocal();  // Load crops when offline
            } else {
                onlineElements.forEach(el => el.style.display = 'block');
                offlineElements.forEach(el => el.style.display = 'none');
                const cropsData = JSON.parse('{{ crops_with_todos | tojson }}');
                saveCropsToLocal(cropsData);  // Save the crops data to IndexedDB for offline use
            }
        }

        window.addEventListener('online', toggleOfflineElements);
        window.addEventListener('offline', toggleOfflineElements);
        toggleOfflineElements();

        function saveCropsToLocal(crops) {
            const dbRequest = indexedDB.open("CropsDB", 1);

            dbRequest.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains("crops")) {
                    db.createObjectStore("crops", { keyPath: "variety_id" });
                }
            };

            dbRequest.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction("crops", "readwrite");
                const store = transaction.objectStore("crops");

                // Clear the object store before adding new data
                const clearRequest = store.clear();

                clearRequest.onsuccess = () => {
                    console.log("IndexedDB cleared");
                    
                    // Insert the new crops
                    crops.forEach(([cropDetails, tasks, variety_id]) => {
                        const cropData = {
                            id: variety_id,
                            crop_info: cropDetails,
                            todos: tasks,
                            variety_id: variety_id
                        };
                        store.put(cropData);
                    });

                    transaction.oncomplete = () => {
                        console.log("Crops saved to IndexedDB");
                    };

                    transaction.onerror = (error) => {
                        console.error("Error saving crops to IndexedDB:", error);
                    };
                };

                clearRequest.onerror = (error) => {
                    console.error("Error clearing IndexedDB:", error);
                };
            };

            dbRequest.onerror = (error) => {
                console.error("Error opening IndexedDB:", error);
            };
        }


    function loadCropsFromLocal() {
        const dbRequest = indexedDB.open("CropsDB", 1);

        dbRequest.onsuccess = (event) => {
            const db = event.target.result;
            const transaction = db.transaction("crops", "readonly");
            const store = transaction.objectStore("crops");
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = (event) => {
                const crops = event.target.result;
                renderCrops(crops);  // Render crops when offline
            };

            getAllRequest.onerror = (error) => {
                console.error("Error fetching crops from IndexedDB:", error);
            };
        };

        dbRequest.onerror = (error) => {
            console.error("Error opening IndexedDB:", error);
        };
    }

    function renderCrops(crops) {
        const container = document.getElementById('crops-container');
        container.innerHTML = ''; // Clear existing content

        crops.forEach(crop => {
            const cropDetails = crop.crop_info;
            const tasks = crop.todos;
            const variety_id = crop.variety_id;

            if (!cropDetails || !cropDetails.variety_name) {
                console.error("Invalid crop data:", crop);
                return; // Skip invalid data
            }

            // Create crop card
            const cropCard = document.createElement('div');
            cropCard.className = 'card card-body m-2 mb-3';
            cropCard.style.minWidth = '75vw';
            cropCard.style.minHeight = '300px';
            cropCard.style.backgroundColor = '#517D5A';

            const header = document.createElement('h3');
            const cardTitle = document.createElement('div');
            cardTitle.className = 'card-title d-flex justify-content-center align-items-center';

            const button = document.createElement('button');
            button.className = 'btn btn-dark';
            button.type = 'button';
            button.id = `card-button-${variety_id}`;
            button.innerHTML = `<em style="font-size: 6.5vw">${cropDetails.variety_name}</em>`;
            cardTitle.appendChild(button);

            header.appendChild(cardTitle);
            cropCard.appendChild(header);

            // Add tasks
            tasks.forEach(todo => {
                const taskRow = document.createElement('div');
                taskRow.className = 'row p-0';
                taskRow.innerHTML = `
                    <div class="checkbox-wrapper-61">
                        <div class="col-2 p-0">
                            <input type="checkbox" class="check" id="check-${todo.task_id}" ${todo.completed ? 'checked' : ''} />
                            <label for="check-${todo.task_id}" onclick="updateTaskStatus(${todo.task_id}, ${todo.completed})" class="label" data-task-id="${todo.task_id}">
                                <svg width="45" height="45" viewBox="0 0 95 95">
                                    <rect x="20" y="20" width="50" height="50" stroke="black" fill="none"></rect>
                                    <g transform="translate(0,-952.36222)">
                                        <path d="m 56,963 c -102,122 6,9 7,9 17,-5 -66,69 -38,52 122,-77 -7,14 18,4 29,-11 45,-43 23,-4" stroke="black" stroke-width="3" fill="none" class="path1"></path>
                                    </g>
                                </svg>
                            </label>
                        </div>
                        <div class="col">
                            <div class="checkbox-text text-white">
                                <h5>${todo.task}</h5>
                                <h6 style="opacity: 70%;">${todo.date}</h6>
                            </div>
                        </div>
                    </div>
                    <hr>
                `;
                cropCard.appendChild(taskRow);
            });

            container.appendChild(cropCard);
        });
    }
    </script>

    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        
    </style>
</head>

<html>
<body style = "font-family: NotoSans; background-color: #fff;">
    <div class = "container-fluid">
        {% include 'homepage/boxes_w_info.html' %}
    </div>
    <div class="container-fluid bg-success-subtle rounded-top-5 p-0 pb-5">

        <div class="container-fluid p-0">
            <div class = "row pt-1 g-0">
                <div class = "col text-center">
                    <h1 style = "font-size: 10vw;">
                        <a href = "/testpage" class = "text-dark"> <b> Crop Tasks: </b> </a>
                    </h1>
                </div>
            </div>
            </h1>
            <div class = "row p-0 g-0">
                {% include 'homepage/cropcards.html' %}
            </div>
            
            <div class="offline-only">
                <div id="crops-container" class="container-fluid p-0">
            <div class="offline-only">
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="online-only">
        {% include 'footer.html' %}
    </footer>

</body>
<script>
    window.addEventListener('online', toggleOfflineElements);
    window.addEventListener('offline', toggleOfflineElements);
</script>
    
</html>
