<!DOCTYPE html>

<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src= 
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <link rel = "stylesheet" href = "../../static/styles.css">

    <style>
        /* Creating the box elements for weather */
        .box-content {
            aspect-ratio: 1;
            height: 100%;
            border-radius: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #309F5E;
        } 
        /* This gets rid of the scrollbar effect */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: NotoSans;
        }

    </style>

</head>

<html>
<body style = "font-family: NotoSans;">
    <div class = "container-fluid">
        <div class = "row mb-3">
            <div class = "col d-flex flex-column">
                <div class="box-content text-white flex-column">
                    <img src="../static/img/sun.png" class = "my-2" style = "height: 15vw">
                    <h4><b>72°</b></h6>
                </div>
            </div>
            <div class = "col d-flex flex-column">
                <div class="box-content text-white flex-column">
                    <img src="../static/img/umbrella.png" class = "mb-2" style = "height: 15vw">
                    <h4><b>75%°</b></h6>
                </div>
            </div>
            <div class = "col d-flex flex-column">
                <div class="box-content text-white flex-column">
                    <img src="../static/img/refresh.png" class = "mb-2" style = "height: 15vw">
                    <h4><b>62°</b></h6>
                </div>
            </div>
        </div>
    </div>


    
    <div class="container-fluid bg-success-subtle rounded-5 p-0" style = "background-color: rgb(105, 138, 119);">
        <!-- Simply for testing, this button takes you to the test page -->
        <div class = "row">
            <div class = "col-6 mx-auto text-center p-3">
                <button class = "btn btn-success w-100" type = "button" id = "test_button"> Go to test page</button>
            </div>
        </div>
        <!----------------- ^Testing^ ----------------->

        <div class="container pb-2">
            <h1>
                <a href = "/testpage" class = "text-white"> Crop Tasks: </a>
            </h1>
            {% include 'homepage/cropcards.html' %}
        </div>
    </div>
    
    
    <script src=
        "https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js">
    </script>

<!-- jQuery functions - just buttons for now -->
    <script>
        $(document).ready(function() {
            $('#test_button').on('click', function() {
                window.location.href = '/testpage';
            });
        });
    </script>
</body>
</html>
