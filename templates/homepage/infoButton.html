<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- Link to Bootstrap CSS -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <!-- Link to Bootstrap js -->
     <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
     <!-- Link to jQuery -->
     <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>


</head>
<body>
    <img id="infoButton-{{crop_info['variety_name']}}" src = "./static/img/info.png" alt="info logo" style="width:8vw;height:8vw;" >
    <button class="btn btn-danger" onclick="deleteCrop({{ todos[0]['user_crop_id'] }})">Delete Crop</button>
    
         <!-- modal popup -->
         <div class="modal" tabindex="-1" id="infoModal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title"> Crop Information </h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
    
                <div class="modal-body">
    
                </div>
    
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
              </div>
            </div>
          </div>

     <!-- Link to Mustache -->
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
    
    <script>
        'use strict';
      



        $(document).ready(function() {
        // When infoButton clicked -> show modal
        $('[id^=infoButton]').on('click', function() {
            var familyClicked = $(this).attr('id').split('infoButton-')[1];
            console.log(familyClicked);

            $("#infoModal").modal('show');

            });
        });
    </script>
          <script src = "../../static/js/script.js"></script>
</body>
</html>
