<!DOCTYPE html>
<html lang="en">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to Bootstrap js -->
    <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiles</title>
    <style>
        
        /* Main container with padding and background color */


        /* Scrollable container for profiles */
        .profiles-list {
            max-height: 500px;
            overflow-y: auto; /* Make it scrollable */
            padding-right: 15px; /* Adding space for the scrollbar */
        }

        /* Styling for each profile card */
        .profile-card {
            background-color: #e9f7e7; /* Light green background */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Profile header with bold styling */
        .profile-header {
            font-size: 1.6em;
            font-weight: bold;
            color: #4CAF50; /* Green header text */
            margin-bottom: 10px;
        }

        /* Profile details with a slightly lighter color */
        .profile-details {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 15px;
        }

        /* Styling for horizontal line */
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    {% include 'header.html' %}

    <div class="container">
        <hr>

        <!-- Scrollable container for profiles -->
        <div class="profiles-list">
            {% for profile in profiles %}
                <div class="profile-card">
                    <div class="profile-header">
                        {{ profile.first_name }} {{ profile.last_name }}
                    </div>
                    <div class="profile-details">
                        {{ profile.email }}
                    </div>
                </div>
            {% endfor %}
        </div>

    </div>

    {% include 'footer.html' %}

</body>
</html>
