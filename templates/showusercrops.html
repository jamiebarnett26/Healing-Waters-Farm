<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Crops</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Custom style for crop icons */
        .crop-icon {
            max-width: 150px;
            max-height: 150px;
        }
        /* Custom green button style */
        .btn-custom-green {
            background-color: #517D5A;
            color: white;
        }
        .btn-custom-green:hover {
            background-color: #436A4A;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">My Crops</h1>
        <div class="row row-cols-2 g-3">
            {% for variety_name, latin_name in crops %}
                <div class="col">
                    <a href="/crop/{{ variety_name }}" class="btn btn-light w-100">
                        <!-- Placeholder image; you can customize to dynamically load specific images -->
                        <img src="/static/icon/corn.png" class="img-fluid crop-icon" alt="{{ variety_name }}">
                        <div class="mt-2">{{ variety_name }}</div>
                        <small class="text-muted">{{ latin_name }}</small>
                    </a>
                </div>
            {% endfor %}
        </div>
        <div class="mt-4">
            <a href="/selectFamily" class="btn btn-custom-green w-100">Add Crop</a>
        </div>
    </div>

    <footer>
        {% include 'footer.html' %}
    </footer>


    <!-- Bootstrap JS and Popper.js via CDN -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHj/GD76VjFqGaabiE/H6jnOE/Ia5nlxQ+24n3y1PwTxeyJz7s4e+4O" crossorigin="anonymous"></script>
</body>
</html>
