<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Crops</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Custom style for crop icons */
        .crop-icon {
            max-width: 150px; /* Adjust this value to control the width */
            max-height: 150px; /* Adjust this value to control the height */
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">My Crops</h1>
        <div class="row row-cols-2 g-3">
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/tomato.png" class="img-fluid crop-icon" alt="Tomato">
                    <div class="mt-2">Tomato</div>
                </button>
            </div>
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/corn.png" class="img-fluid crop-icon" alt="Corn">
                    <div class="mt-2">Corn</div>
                </button>
            </div>
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/carrot.png" class="img-fluid crop-icon" alt="Carrot">
                    <div class="mt-2">Carrot</div>
                </button>
            </div>
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/pepper.png" class="img-fluid crop-icon" alt="Pepper">
                    <div class="mt-2">Pepper</div>
                </button>
            </div>
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/grain.png" class="img-fluid crop-icon" alt="Grain">
                    <div class="mt-2">Grain</div>
                </button>
            </div>
            <div class="col">
                <button class="btn btn-light w-100">
                    <img src="/static/icon/beet.png" class="img-fluid crop-icon" alt="Beet">
                    <div class="mt-2">Beet</div>
                </button>
            </div>
            <!-- Additional crops can be added in similar divs -->
        </div>
        <div class="mt-4">
            <button class="btn btn-secondary w-100">Add Crop</button>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js via CDN -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHj/GD76VjFqGaabiE/H6jnOE/Ia5nlxQ+24n3y1PwTxeyJz7s4e+4O" crossorigin="anonymous"></script>
</body>
</html>
