<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to Bootstrap js -->
    <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap Icons! -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <!-- CSS for todo list element -->
    <link rel = "stylesheet" href = "../../static/css/todo.css">


    <meta name="theme-color" content="#e7fff5"/>
    <style>
        .box-content {
            aspect-ratio: 1.1;
            width: 100%;
            border-radius: 15%;
            background-color: #dddddd;
        } 
        .title-text {
            font-size: 5.5rem;
            font-weight: bold; 
        }
        .edit-button {
            aspect-ratio: 1.5;
            width: 100%;
            background-color: #dddddd;
        }
        .crop-name {
            font-size: clamp(50px, 8vw, 80px);
            font-weight: bold;

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */
            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .latin-name {
            font-size: clamp(15px, 4vw, 45px);
            font-style: italic;
            color: gray; 

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */

            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .info-button {
            aspect-ratio: 1;
            width: 50px;
            border-radius: 50%;
        }

        .tasks {
            font-size: clamp(15px, 4vw, 45px);
        }

        .checkbox-wrapper-11 {
            transform: scale(1.5); 
            transform-origin: top left; 
        }

        /* For the checkbox tasks and dates below */
        .checkbox-wrapper-11 label span.task {
            display: block; /* Ensure task is on its own line */
            font-weight: bold;
        }

        .checkbox-wrapper-11 label span.date {
            display: block; /* Ensure date is on its own line */
            font-size: 0.8em;
        }
    </style>
</head>


<body>
    <div class="container-fluid px-3" style = "background-color: #e7fff5;">
        <div class="row">
            <div class="col-4">
                <div class="box-content align-content-center text-center mb-2">
                    Crop Image Here
                </div>
            </div>
            <div class="col-6 d-flex flex-column justify-content-middle"> 
                <div class="crop-name"> {{ variety_name }} </div>
                <div class="latin-name"> {{ latin_name }}</div> 
                </div>
                
            <div class="col-2 d-flex flex-column justify-content-end text-center align-content-center">
                <button type="button" class="btn btn-outline-success edit-button mb-3" id = "test-button"><i class="bi bi-pen fs-1"></i></button>
            </div>
        </div>
        <div class="row">
            <div id = "task_list">  </div>
        </div>
        <div class="row">
            <div id = "calendar"></div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row">
            <h1 style = "font-size: 10vw; font-weight: bold;"><u>Tasks:</u></h1>
            <span id="taskList" class = "tasks"></span>
        </div>
    </div>
    
</body>

<!-- Link to Mustache -->
<script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js">
</script>

<script>
    'use strict';

    $(document).ready(function() {
        $('#test-button').on('click', function() {
                $(this).text('Done!');
            });
    });
 
    // function to create the inner text for the html element with the todo list
    const createTodoItem = (todo, index) => 
    `
        <div class="checkbox-wrapper-11">
                <input id="02-${index}" type="checkbox" value="2">
                <label for="02-${index}">
                    <span class="task"> ${todo.task} </span>
                    <span class="date">Due: ${todo.date} </span>
                </label>
            <hr>
            <br>
        </div>
    `

    $(document).ready(function() {

        $.ajax({
            url: '/getTasks',
            method: 'GET',
            // data: full_crop_infos, not working
            success: function(todos) {
                console.log('Todos:', todos);

                todos.forEach((todo, index) => {
                    $('#taskList').append(createTodoItem(todo, index));
                });
            },

            error: function(xhr, status, error) {
                console.error('Error fetching tasks:', error);
            }
        });
    })
</script>
