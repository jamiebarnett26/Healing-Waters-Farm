<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to Bootstrap js -->
    <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>


    <style>
        .box-content {
            aspect-ratio: 1.1;
            width: 100%;
            border-radius: 15%;
            background-color: #ECE6F0;
        } 
        .title-text {
            font-size: 5.5rem;
            font-weight: bold; 
        }
        .edit-button {
            aspect-ratio: 1.5;
            width: 100%;
            background-color: #ECE6F0;
        }
        .crop-name {
            font-size: clamp(50px, 8vw, 80px);
            font-weight: bold;

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */
            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        .latin-name {
            font-size: clamp(15px, 4vw, 45px);
            font-style: italic; /* Italic for Latin names */
            color: gray; /* Optional for differentiation */
        }
        .info-button {
            aspect-ratio: 1;
            width: 50px;
            border-radius: 50%;
        }
    </style>
</head>


<body>
    <div class="container-fluid" style = "background-color: #e7fff5;">
        <div class="row">
            <div class="col-4">
                <div class="box-content align-content-center text-center">
                    Crop Image Here
                </div>
            </div>
            <div class="col-6"> 
                <div class="crop-name" id = "crop-name-block"> Reden Tomato </div>
                <div class="latin-name" id="latin-name-block">Lycopersicon esculentum</div>
                </div>
                
            <div class="col-2 align-content-center">
                <button type="button" class="btn btn-outline-success edit-button" id = "test-button">Edit Button</button>
                <img id="infoButton" src = "./static/img/info.png" alt="info logo" style="width:8vw;height:8vw;" >
            </div>
        </div>
        <div class="row">
            <div id = "task_list">  </div>
        </div>
        <div class="row">
            <div id = "calendar"></div>
        </div>
    </div>
    <hr>

</body>

<script>
    'use strict';

    $(document).ready(function() {
        $('#test-button').on('click', function() {
                $(this).text('Done!');
            });
    });
</script>
