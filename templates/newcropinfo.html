<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to Bootstrap js -->
    <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap Icons! -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">


    <meta name="theme-color" content="#e7fff5"/>
    <style>
        .box-content {
            aspect-ratio: 1.1;
            width: 100%;
            border-radius: 15%;
            background-color: #dddddd;
        } 
        .title-text {
            font-size: 5.5rem;
            font-weight: bold; 
        }
        .edit-button {
            aspect-ratio: 1.5;
            width: 100%;
            background-color: #dddddd;
        }
        .crop-name {
            font-size: clamp(50px, 8vw, 80px);
            font-weight: bold;

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */
            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .latin-name {
            font-size: clamp(15px, 4vw, 45px);
            font-style: italic;
            color: gray; 

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */

            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .info-button {
            aspect-ratio: 1;
            width: 50px;
            border-radius: 50%;
        }
    </style>
</head>


<body>
    <div class="container-fluid px-3" style = "background-color: #e7fff5;">
        <div class="row">
            <div class="col-4">
                <div class="box-content align-content-center text-center mb-2">
                    Crop Image Here
                </div>
            </div>
            <div class="col-6"> 
                <div class="crop-name" id = "crop-name-block"> Reden Tomato </div>
                <div class="latin-name" id="latin-name-block">Short Name</div> 
                </div>
                
            <div class="col-2 d-flex flex-column justify-content-end text-center align-content-center">
                <button type="button" class="btn btn-outline-success edit-button mb-3" id = "test-button"><i class="bi bi-pen fs-1"></i></button>
            </div>
        </div>
        <div class="row">
            <div id = "task_list">  </div>
        </div>
        <div class="row">
            <div id = "calendar"></div>
        </div>
    </div>
    <div class="container-fluid">
        {% include 'calendar.html' %}
    </div>
    

</body>

<script>
    'use strict';

    $(document).ready(function() {
        $('#test-button').on('click', function() {
                $(this).text('Done!');
            });
    });
</script>
