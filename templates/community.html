<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <style>
            /* Base tab styles */
            .nav-tabs .nav-link {
                background-color: #ffffff;
                color: #28a745;
                border: 1px solid #28a745; 
            }
            .nav-tabs .nav-link.active {
                background-color: #28a745 !important;
                color: white !important; 
                border-color: #28a745 !important; 
            }
        </style>
        
        
        

        <!-- Link to Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Link to jQuery -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    </head>
    <body>
        {% include 'header.html' %}

        <div class="container-fluid mt-3">
            <ul class="nav nav-tabs" id="contentTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="announcements-tab" data-bs-toggle="tab" href="#announcements" role="tab" aria-controls="announcements" aria-selected="true">Announcements</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="advice-board-tab" data-bs-toggle="tab" href="#advice-board" role="tab" aria-controls="advice-board" aria-selected="false">Advice Board</a>
                </li>
            </ul>
        </div>

        <div class="tab-content" id="contentTabsContent" style="margin-bottom: 3rem;">
            <div class="tab-pane fade" id="announcements" role="tabpanel">
                {% include 'announcements.html' %}
            </div>
            <div class="tab-pane fade" id="advice-board" role="tabpanel">
                {% include 'adviceboard.html' %}
            </div>
        </div>

        <footer class="mt-4 border-top">
            {% include 'footer.html' %}
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const activeTab = localStorage.getItem('activeTab');

                if (activeTab) {
                    const activeTabLink = document.getElementById(activeTab);
                    if (activeTabLink) {
                        activeTabLink.classList.add('active');  
                        const activeTabContent = document.getElementById(activeTabLink.getAttribute('href').substring(1));
                        if (activeTabContent) {
                            activeTabContent.classList.add('show', 'active');  
                        }
                    }
                } else {
                    const defaultTabLink = document.getElementById('announcements-tab');
                    defaultTabLink.classList.add('active');
                    const defaultTabContent = document.getElementById('announcements');
                    defaultTabContent.classList.add('show', 'active');
                }

                $('#contentTabs a').on('click', function (e) {
                    const targetTabId = e.target.id;
                    localStorage.setItem('activeTab', targetTabId); 
                });
            });
        </script>

    </body>
</html>
