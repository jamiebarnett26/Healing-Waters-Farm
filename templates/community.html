<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Link to Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <!-- Our CSS -->
        <link rel="stylesheet" href="../../static/css/styles.css">

        <!-- Link to Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Link to jQuery -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    </head>
    <body>
        {% include 'header.html' %}

        <!-- Tab navigation -->
        <div class="container-fluid mt-3">
            <ul class="nav nav-tabs" id="contentTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="announcements-tab" data-bs-toggle="tab" href="#announcements" role="tab" aria-controls="announcements" aria-selected="true">Announcements</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="advice-board-tab" data-bs-toggle="tab" href="#advice-board" role="tab" aria-controls="advice-board" aria-selected="false">Advice Board</a>
                </li>
            </ul>
        </div>

        <!-- Tab content -->
        <div class="tab-content" id="contentTabsContent">
            <div class="tab-pane fade show active" id="announcements" role="tabpanel" aria-labelledby="announcements-tab">
                <!-- Include announcements section -->
                {% include 'announcements.html' %}
            </div>
            <div class="tab-pane fade" id="advice-board" role="tabpanel" aria-labelledby="advice-board-tab">
                <!-- Include advice board section -->
                {% include 'adviceboard.html' %}
            </div>
        </div>

        {% include 'footer.html' %}
    </body>
</html>
