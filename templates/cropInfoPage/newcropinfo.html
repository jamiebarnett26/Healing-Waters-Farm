<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to Bootstrap js -->
    <script src= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <!-- Link to jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Bootstrap Icons! -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <!-- CSS for todo list element -->
    <link rel = "stylesheet" href = "../../static/css/todo.css">


    <meta name="theme-color" content="#e7fff5"/>
    <style>
        .box-content {
            aspect-ratio: 1.1;
            width: 100%;
            border-radius: 15%;
            background-color: #dddddd;
        } 
        .title-text {
            font-size: 5.5rem;
            font-weight: bold; 
        }

        .crop-name {
            font-size: clamp(35px, 7vw, 70px);
            font-weight: bold;

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */
            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .latin-name {
            font-size: clamp(15px, 4vw, 45px);
            font-style: italic;
            color: gray; 

            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; /* for avoiding warnings */

            word-break: break-word;

            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .info-button {
            aspect-ratio: 1;
            width: 50px;
            border-radius: 50%;
        }

        html, body {
            overflow-x: hidden;
        }

        /* Base tab styles */
        .nav-tabs .nav-link {
            background-color: #ffffff;
            color: #000;
            border: 1px solid #28a745; 
            height: 100%;
        }

        .nav-tabs .nav-link.active {
            height: 100%;
            background-color: #e7fff5 !important;
            color: #000 !important; 
            border-color: #28a745 !important; 
        }

    </style>
</head>


<body>
    <div class="container-fluid px-3" style = "background-color: #e7fff5;">
        <div class="row">
            <div class="col-4">
                <div class="box-content align-content-center text-center mb-2">
                    <img src = "../../static/icon/crop.png" style = "width: 25vw;">
                </div>
            </div>
            <div class="col-8 d-flex flex-column justify-content-end pb-4"> 
                <div class="crop-name"> {{ variety_name }} </div>
                <div class="latin-name"> {{ latin_name }}</div> 
            </div>
                
        </div>
    </div>
        
    <div class="container-fluid mt-3">
        <div class="d-flex justify-content-center">
            <ul class="nav nav-tabs w-100" id="contentTabs" role="tablist">
                <li class="nav-item w-50 text-center" role="presentation">
                    <a class="nav-link" id="tasks-tab" data-bs-toggle="tab" href="#tasks" role="tab" aria-controls="tasks" aria-selected="true" style = "font-size: 6.5vw; font-weight: bold;">Tasks</a>
                </li>
                <li class="nav-item w-50 text-center" role="presentation">
                    <a class="nav-link" id="all-info-tab" data-bs-toggle="tab" href="#all-info" role="tab" aria-controls="all-info" aria-selected="false" style = "font-size: 6.5vw; font-weight: bold;">All Info</a>
                </li>
            </ul>
        </div>
    </div>
    
    <div class="tab-content" id="contentTabsContent">
        <!-- Where the tasks appear -->
        <div class="tab-pane fade" id="tasks" role="tabpanel" aria-labelledby="tasks-tab">

            {% include 'cropInfoPage/cropinfotasks.html' %}

        </div>


        <!-- Where all of the raw info appears -->
        <div class="tab-pane fade" id="all-info" role="tabpanel" aria-labelledby="all-info-tab">

            {% include 'cropInfoPage/cropinfoinfo.html' %}

        </div>
    </div>
</body>

<!-- Link to Mustache -->
<script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js">
</script>

<script>
    'use strict';

    $(document).ready(function() {
        $('#test-button').on('click', function() {
                $(this).text('Done!');
            });
    });
 
    //shortens string to desired length
    function shortenLongString(long_string, len) {
        if (long_string.length > len) {
            return long_string.substring(0, len) + "..."; 
        }
        return long_string;
    }
    
</script>


<!-- For Tabs -->
<script>
    'use strict';

    document.addEventListener("DOMContentLoaded", function() {
                // Get the last active tab from localStorage
                const activeTab = localStorage.getItem('activeTab');

                if (activeTab) {
                    const activeTabLink = document.getElementById(activeTab);
                    if (activeTabLink) {
                        // Makes active tab visible
                        activeTabLink.classList.add('active');  
                        // Gets id of tab content (the announcements or advice page) -> #announcements or #advice-board
                        // substring removes # in front
                        const activeTabContent = document.getElementById(activeTabLink.getAttribute('href').substring(1));
                        if (activeTabContent) {
                            // Makes tab content (html file) visible
                            activeTabContent.classList.add('show', 'active');  
                        }
                    }
                } else {
                    // If no tab is stored, just show announcements
                    const defaultTabLink = document.getElementById('tasks-tab');
                    defaultTabLink.classList.add('active');
                    const defaultTabContent = document.getElementById('tasks');
                    defaultTabContent.classList.add('show', 'active');
                }

                // Event listener to save the active tab in localStorage when a tab is clicked
                $('#contentTabs a').on('click', function (e) {
                    const targetTabId = e.target.id;
                    localStorage.setItem('activeTab', targetTabId); 
                });
            });
</script>
