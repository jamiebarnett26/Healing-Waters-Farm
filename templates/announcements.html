<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .content-wrapper {
            flex: 1; /* This ensures that the content takes up available space */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center vertically */
            align-items: center; /* Center horizontally */
            padding: 20px;
        }

        .page-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .popup-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #ccc;
            background: #fff;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            width: 300px;
            max-width: 90%;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .announcement-box {
            background-color: #28a745; /* Green background */
            color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .announcement-header {
            background-color: white;
            color: #28a745; /* Green text */
            padding: 10px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .announcement-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .announcement-user {
            margin: 0;
            font-size: 1.1em;
        }

        .announcement-text {
            font-size: 1.1em;
            margin-top: 10px;
        }

        .announcement-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
        }

        .announcement-actions .btn {
            margin-right: 10px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        body {
            padding-bottom: 8vh; 
        }
    </style>
</head>
<body>
    <!-- Content wrapper to center the page content between header and footer -->
    <div class="content-wrapper">
        <h1 class="page-title">Announcements</h1>

        <!-- Popup form for adding a new announcement -->
        <div id="addAnnouncementPopup" class="popup-form" style="display: none;">
            <form action="/addannouncement/{{ announcement_id }}" method="post">
                <div class="form-group">
                    <label for="title"><strong>Title</strong></label>
                    <input type="text" name="title" id="title" required class="form-control" autofocus>
                </div>
                <div class="form-group">
                    <label for="text"><strong>Text</strong></label>
                    <textarea name="text" id="text" class="form-control" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <input type="submit" value="Create Announcement" class="btn btn-primary">
                    <button type="button" onclick="togglePopup('addAnnouncementPopup')" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>

        {% if admin %}
        <!-- Button to open the popup form for adding a new announcement -->
        <button onclick="togglePopup('addAnnouncementPopup')" class="btn btn-primary">Create Announcement</button>
        {% endif %}

        <br><br>

        {% for announcement in announcements %}
        <div id="editAnnouncementPopup{{ announcement['announcement_id'] }}" class="popup-form" style="display: none;">
            <form action="/editannouncement/{{ announcement['announcement_id'] }}" method="post">
                <div class="form-group">
                    <label for="title{{ announcement['announcement_id'] }}"><strong>Title</strong></label>
                    <input type="text" name="title" id="title{{ announcement['announcement_id'] }}" value="{{ announcement['title'] }}" required class="form-control">
                </div>
                <div class="form-group">
                    <label for="text{{ announcement['announcement_id'] }}"><strong>Text</strong></label>
                    <textarea name="text" id="text{{ announcement['announcement_id'] }}" class="form-control" rows="4">{{ announcement['text'] }}</textarea>
                </div>
                <div class="form-actions">
                    <input type="submit" value="Edit Announcement" class="btn btn-primary">
                    <button type="button" onclick="togglePopup('editAnnouncementPopup{{ announcement['announcement_id'] }}')" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Announcement Container -->
        <div class="announcement-box">
            <div class="announcement-header">
                <h2>{{ announcement['title'] }}</h2>
                <p class="announcement-user">{{ announcement['user_name'] }}</p>
            </div>
            <p class="announcement-text">{{ announcement['text'] }}</p>

            {% if (admin) or (user_id|string == announcement['user_id']|string) %}
            <div class="announcement-actions">
                <button onclick="togglePopup('editAnnouncementPopup{{ announcement['announcement_id'] }}')" class="btn btn-edit">Edit</button>
                <form action="/deleteannouncement/{{ announcement['announcement_id'] }}" method="post" class="delete-form">
                    <input type="submit" value="Delete" class="btn btn-danger">
                </form>
            </div>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <!-- Overlay for popup background -->
    <div id="overlay" class="overlay" style="display: none;"></div>

    <script>
        function togglePopup(popupId) {
            const popupForm = document.getElementById(popupId);
            const overlay = document.getElementById('overlay');
            if (popupForm.style.display === 'none') {
                popupForm.style.display = 'block';
                overlay.style.display = 'block';
            } else {
                popupForm.style.display = 'none';
                overlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
